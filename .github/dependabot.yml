version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - deps
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Major bumps are not in the group, so Dependabot still opens them --
    # just as individual PRs (one per package) rather than batched. This
    # keeps Astro, mdx, sitemap etc. visible and separately reviewable.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - deps
      - ci
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
    # Same pattern as the npm block: group boring minor/patch bumps so the
    # inbox stays quiet, let majors (actions/checkout@v5 etc.) surface
    # individually so they can be reviewed on their own.

  # infra/ is OpenTofu (cloudflare provider, pinned in versions.tf with a
  # lock file). Without this, the provider that controls DNS/TLS/Pages never
  # gets automated update PRs. Updates are infrequent, so no grouping -- surface
  # each provider bump on its own for review.
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
      day: monday
    labels:
      - deps
      - infra
