name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: the check job only reads the repo (checkout, install, lint,
# typecheck, build, size budget). Without this, GITHUB_TOKEN inherits the repo
# default, which can be read-write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm lint

      - name: Typecheck (astro check)
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: First-load size budget
        run: |
          html_bytes=$(wc -c < dist/index.html)
          font_bytes=$(wc -c < dist/fonts/newsreader-latin-400.woff2)
          total=$((html_bytes + font_bytes))
          echo "index.html: ${html_bytes} bytes"
          echo "font:       ${font_bytes} bytes"
          echo "total:      ${total} bytes (budget: 50000)"
          if [ "$total" -gt 50000 ]; then
            echo "::error::First-load budget exceeded: ${total} > 50000"
            exit 1
          fi
