name: infra

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.0"

      - name: Write backend.hcl
        run: |
          cat > backend.hcl <<EOF
          endpoints = {
            s3 = "https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          }
          EOF

      - name: tofu fmt
        run: tofu fmt -check -recursive

      - name: tofu init
        run: tofu init -backend-config=backend.hcl

      - name: tofu validate
        run: tofu validate

      - name: tofu plan
        id: plan
        run: |
          set +e
          tofu plan -no-color -out=plan.bin > plan.txt 2>&1
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          {
            echo 'output<<PLAN_EOF'
            tail -c 60000 plan.txt
            echo
            echo 'PLAN_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: infra-plan
          message: |
            ### `tofu plan` (infra)

            <details><summary>Plan output</summary>

            ```
            ${{ steps.plan.outputs.output }}
            ```

            </details>

      - name: Fail if plan errored
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.0"

      - name: Write backend.hcl
        run: |
          cat > backend.hcl <<EOF
          endpoints = {
            s3 = "https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          }
          EOF

      - name: tofu init
        run: tofu init -backend-config=backend.hcl

      - name: tofu apply
        run: tofu apply -auto-approve
